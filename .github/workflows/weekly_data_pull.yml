name: Weekly CFBD Data Pull

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest week of games
        working-directory: ingestion
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          WAREHOUSE: ${{ secrets.WAREHOUSE }}
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
        run: |
          # TODO: compute current year/week dynamically instead of hardcoding
          python pull_games.py --year 2026 --week 9